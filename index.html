<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solo canciones</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0a10">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Canciones">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calma nocturna, sin ruido; una canción a la vez
   IDEA: un tocadiscos infinito; cada deslizada cambia el disco
   PICTURE: un vinilo grande que gira con la carátula de la canción
   COLOUR and TYPE: noche profunda, un tono por canción, Outfit
   LAYOUT: pantalla completa, scroll vertical con snap, controles a la derecha */
:root{color-scheme:dark;--bg:#0b0a10;--ink:#f4f1fa;--mut:#a9a3b8;--acc:#ff5a7a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:2px solid #fff;outline-offset:3px}
#feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(120% 80% at 30% 20%,hsl(var(--h) 70% 34%),transparent 60%),radial-gradient(90% 70% at 80% 90%,hsl(calc(var(--h) + 50) 60% 22%),transparent 65%),#0b0a10}
.disc{width:min(72vw,52dvh,420px);aspect-ratio:1;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle,#141218 0 2px,#1c1a22 2px 4px);box-shadow:0 30px 60px #0009,inset 0 0 0 2px #ffffff14;
  animation:spin 6s linear infinite;animation-play-state:paused;margin-top:-8dvh}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent,#ffffff1c 8%,transparent 18%,transparent 50%,#ffffff14 58%,transparent 68%)}
.label{position:absolute;inset:31%;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,hsl(var(--h) 80% 60%),hsl(calc(var(--h) + 40) 70% 40%));box-shadow:0 0 0 3px #0006}
.label img{width:100%;height:100%;object-fit:cover}
.label::after{content:"";width:9%;aspect-ratio:1;border-radius:50%;background:#0b0a10;position:absolute}
body.playing .slide.cur .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.meta{position:absolute;left:max(5vw,18px);right:88px;bottom:calc(64px + env(safe-area-inset-bottom));}
.meta h2{margin:0;font-size:clamp(24px,5.5vw,38px);line-height:1.08;font-weight:800;text-wrap:balance;overflow-wrap:anywhere}
.meta p{margin:6px 0 0;color:var(--mut);font-size:17px}
.rail{position:absolute;right:max(3vw,12px);bottom:calc(70px + env(safe-area-inset-bottom));display:grid;gap:18px;justify-items:center}
.rb{width:52px;height:52px;border-radius:50%;border:0;background:#ffffff1a;backdrop-filter:blur(8px);display:grid;place-items:center}
.rb svg{width:26px;height:26px}
.like.on{color:var(--acc)}.like.on svg path{fill:currentColor}
.del.ask{background:var(--acc);width:auto;padding:0 14px;border-radius:26px;font-size:14px;font-weight:600}
.tap{position:absolute;inset:0;border:0;background:none}
#top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:center;gap:22px;align-items:center;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;background:linear-gradient(#000a,transparent)}
.tab{border:0;background:none;font-size:17px;font-weight:600;color:var(--mut);padding:8px 4px;min-height:44px}
.tab.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
#menuBtn{position:absolute;right:12px;width:44px;height:44px;border:0;background:none;border-radius:50%}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 max(5vw,18px) calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
#seek{flex:1;accent-color:#fff;height:28px}
#flash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6;opacity:0;transition:opacity .4s}
#flash.show{opacity:1;transition:none}
#flash div{width:84px;height:84px;border-radius:50%;background:#0008;display:grid;place-items:center}
#flash svg{width:40px;height:40px}
.screen{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:24px;text-align:center;
  background:radial-gradient(90% 60% at 50% 30%,#3a1d52,transparent 70%),var(--bg)}
.screen h1{font-size:clamp(34px,8vw,52px);line-height:1.05;margin:24px 0 10px;font-weight:800;text-wrap:balance}
.screen p{color:var(--mut);max-width:34ch;margin:0 auto 26px}
.big{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:30px;border:0;background:var(--ink);color:#111;font-weight:600;font-size:17px}
.ghost{background:#ffffff14;color:var(--ink)}
.mini{width:120px;aspect-ratio:1;margin:auto;border-radius:50%;background:repeating-radial-gradient(circle,#141218 0 2px,#1c1a22 2px 4px);position:relative;animation:spin 5s linear infinite;box-shadow:0 20px 40px #0008}
.mini::before{content:"";position:absolute;inset:32%;border-radius:50%;background:linear-gradient(135deg,var(--acc),#8a4dff)}
.stack{display:grid;gap:12px;justify-items:center}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
#sheet{position:fixed;inset:0;z-index:9;background:#0008;display:none;align-items:end;justify-content:center}
#sheet.open{display:flex}
#sheet .in{background:#17151d;width:min(520px,100%);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:grid;gap:10px}
#sheet h3{margin:0 0 4px;font-size:20px}
#sheet .row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-radius:14px;background:#ffffff0d;border:0;text-align:left;width:100%}
#sheet .row.danger{color:var(--acc)}
#sheet small{color:var(--mut);font-size:13px}
#busy{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;background:#000c;padding:16px 22px;border-radius:14px;display:none}
.empty{height:100dvh;display:grid;place-items:center;color:var(--mut);text-align:center;padding:24px}
@media (prefers-reduced-motion:reduce){.disc,.mini{animation:none}}
</style>
</head>
<body>
<div id="feed" aria-live="polite"></div>

<header id="top">
  <button class="tab on" id="tabAll">Para ti</button>
  <button class="tab" id="tabFav">Me gustan</button>
  <button id="menuBtn" aria-label="Menú"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>

<div id="bar"><span id="tCur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posición"><span id="tDur">0:00</span></div>
<div id="flash"><div id="flashIcon"></div></div>
<div id="busy">Cargando canciones…</div>

<div class="screen" id="welcome" hidden>
  <div>
    <div class="mini"></div>
    <h1>Solo canciones</h1>
    <p>Desliza como siempre, pero aquí solo hay música. Elige las canciones que ya tienes descargadas.</p>
    <div class="stack">
      <label class="big"><input type="file" class="pick" accept="audio/*,.mp3,.m4a,.aac,.ogg,.opus,.wav,.flac" multiple>Elegir canciones</label>
      <label class="big ghost"><input type="file" class="pick" webkitdirectory multiple>Elegir una carpeta</label>
    </div>
  </div>
</div>

<div class="screen" id="start" hidden>
  <div>
    <div class="mini"></div>
    <h1 id="startTitle">Listo</h1>
    <p>Toca para empezar. Desliza hacia arriba para la siguiente; toca la pantalla para pausar.</p>
    <button class="big" id="startBtn">Empezar a escuchar</button>
  </div>
</div>

<div id="sheet">
  <div class="in">
    <h3>Tu música</h3>
    <label class="row"><input type="file" class="pick" accept="audio/*,.mp3,.m4a,.aac,.ogg,.opus,.wav,.flac" multiple>＋ Añadir canciones</label>
    <label class="row"><input type="file" class="pick" webkitdirectory multiple>＋ Añadir una carpeta</label>
    <button class="row" id="shuffleBtn">Volver a mezclar</button>
    <button class="row danger" id="clearBtn">Borrar todas las canciones</button>
    <small id="info"></small>
    <button class="big ghost" id="closeSheet">Cerrar</button>
  </div>
</div>

<script>
{
const $=s=>document.querySelector(s);
const feed=$('#feed'),audio=new Audio();audio.preload='auto';
const ICON={
  play:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.2 3 4.5 6.6 4.5c2.1 0 3.4 1.2 5.4 3.3 2-2.1 3.3-3.3 5.4-3.3 3.6 0 5.4 3.7 3.8 6.9C19 15.6 12 20 12 20z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>!isFinite(t)?'0:00':Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};

/* ---------- almacenamiento (IndexedDB) ---------- */
let db=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('solo-canciones',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id'});
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
function dbAll(){return new Promise(res=>{if(!db)return res([]);try{const q=db.transaction('songs').objectStore('songs').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}
function dbOp(fn){return new Promise(res=>{if(!db)return res(false);try{const tx=db.transaction('songs','readwrite');fn(tx.objectStore('songs'));tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false)}catch(e){res(false)}})}

/* ---------- etiquetas ID3 (título, artista, carátula) ---------- */
function decode(bytes,enc){
  try{
    if(enc===0)return new TextDecoder('latin1').decode(bytes);
    if(enc===3)return new TextDecoder('utf-8').decode(bytes);
    if(enc===2)return new TextDecoder('utf-16be').decode(bytes);
    if(bytes[0]===0xFE&&bytes[1]===0xFF)return new TextDecoder('utf-16be').decode(bytes.subarray(2));
    if(bytes[0]===0xFF&&bytes[1]===0xFE)return new TextDecoder('utf-16le').decode(bytes.subarray(2));
    return new TextDecoder('utf-16le').decode(bytes);
  }catch(e){return ''}
}
const clean=s=>s.replace(/\u0000/g,' ').trim();
async function readTags(file){
  const out={};
  try{
    const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(head[0]!==73||head[1]!==68||head[2]!==51)return out;
    const ver=head[3],size=(head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9];
    if(ver<3)return out;
    const b=new Uint8Array(await file.slice(10,10+Math.min(size,8e6)).arrayBuffer());
    let p=0;
    if(head[5]&0x40){const ext=ver===4?((b[0]<<21)|(b[1]<<14)|(b[2]<<7)|b[3]):((b[0]<<24)|(b[1]<<16)|(b[2]<<8)|b[3])+4;p=ext}
    while(p+10<b.length){
      const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);
      if(!/^[A-Z0-9]{4}$/.test(id))break;
      const fs=ver===4?((b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7]):((b[p+4]<<24)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7]);
      const d=b.subarray(p+10,p+10+fs);p+=10+fs;
      if(fs<=0)break;
      if(id==='TIT2')out.title=clean(decode(d.subarray(1),d[0]));
      else if(id==='TPE1')out.artist=clean(decode(d.subarray(1),d[0]));
      else if(id==='APIC'&&!out.cover){
        const enc=d[0];let i=1;while(i<d.length&&d[i]!==0)i++;
        const mime=new TextDecoder('latin1').decode(d.subarray(1,i))||'image/jpeg';i+=2;
        if(enc===1||enc===2){while(i+1<d.length&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2}else{while(i<d.length&&d[i]!==0)i++;i++}
        if(i<d.length)out.cover=new Blob([d.slice(i)],{type:mime.includes('/')?mime:'image/'+mime.toLowerCase()});
      }
    }
  }catch(e){}
  return out;
}
function fromName(name){
  const base=name.replace(/\.[^.]+$/,'').replace(/_/g,' ').replace(/^\d{1,3}[\s.\-]+/,'').trim();
  const m=base.split(' - ');
  return m.length>1?{artist:m[0].trim(),title:m.slice(1).join(' - ').trim()}:{title:base};
}

/* ---------- estado ---------- */
let songs=[],list=[],cur=-1,started=false,mode='all',curURL=null,saveOK=true;
const covers=new Map();
const coverURL=s=>{if(!s.cover)return '';if(!covers.has(s.id))covers.set(s.id,URL.createObjectURL(s.cover));return covers.get(s.id)};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function render(keepId){
  list=mode==='fav'?songs.filter(s=>s.liked):songs.slice();
  if(!list.length){feed.innerHTML='<div class="empty">'+(mode==='fav'?'Todavía no le has dado corazón a ninguna canción.':'No hay canciones. Añade algunas desde el menú.')+'</div>';cur=-1;audio.pause();return}
  feed.innerHTML=list.map((s,i)=>{const c=coverURL(s);return `
  <section class="slide" data-i="${i}" style="--h:${hue(s.title+s.artist)}">
    <button class="tap" aria-label="Pausar o reproducir"></button>
    <div class="disc"><div class="label">${c?`<img src="${c}" alt="">`:''}</div></div>
    <div class="meta"><h2>${esc(s.title)}</h2><p>${esc(s.artist||'Artista desconocido')}</p></div>
    <div class="rail">
      <button class="rb like${s.liked?' on':''}" aria-label="Me gusta" aria-pressed="${!!s.liked}">${ICON.heart}</button>
      <button class="rb del" aria-label="Quitar canción">${ICON.trash}</button>
    </div>
  </section>`}).join('');
  for(const el of feed.querySelectorAll('.slide'))io.observe(el);
  cur=-1;
  const k=keepId?list.findIndex(s=>s.id===keepId):0;
  const target=feed.children[Math.max(0,k)];
  feed.scrollTop=target?target.offsetTop:0;
  setCurrent(Math.max(0,k));
}

function setCurrent(i){
  if(i===cur||!list[i])return;
  cur=i;
  feed.querySelectorAll('.slide.cur').forEach(e=>e.classList.remove('cur'));
  feed.children[i]?.classList.add('cur');
  const s=list[i];
  if(curURL)URL.revokeObjectURL(curURL);
  curURL=URL.createObjectURL(s.blob);
  audio.src=curURL;
  if(started)play();
  try{if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist||'',artwork:s.cover?[{src:coverURL(s)}]:[]})}}catch(e){}
}
function play(){audio.play().catch(()=>document.body.classList.remove('playing'))}
function go(d){const n=(cur+d+list.length)%list.length;feed.children[n]?.scrollIntoView({behavior:'smooth'})}

const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting)setCurrent(+e.target.dataset.i)},{root:feed,threshold:.6});

/* ---------- añadir canciones ---------- */
async function addFiles(files){
  files=[...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|aac|ogg|opus|wav|flac)$/i.test(f.name));
  if(!files.length)return;
  $('#busy').style.display='block';
  const known=new Set(songs.map(s=>s.id)),fresh=[];
  for(const f of files){
    const id=f.name+'|'+f.size;if(known.has(id))continue;known.add(id);
    const t=await readTags(f),n=fromName(f.name);
    fresh.push({id,title:t.title||n.title,artist:t.artist||n.artist||'',cover:t.cover||null,blob:new Blob([f],{type:f.type||'audio/mpeg'}),liked:false});
  }
  if(fresh.length){
    const ok=await dbOp(st=>fresh.forEach(s=>st.put(s)));
    if(!ok)saveOK=false;
    songs=shuffle(songs.concat(fresh));
  }
  $('#busy').style.display='none';
  $('#welcome').hidden=true;$('#sheet').classList.remove('open');
  mode='all';tabs();
  render(list[cur]?.id);
  if(!started)showStart();
  info();
}
document.querySelectorAll('.pick').forEach(inp=>inp.addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''}));

function showStart(){$('#startTitle').textContent=songs.length+(songs.length===1?' canción lista':' canciones listas');$('#start').hidden=false}
$('#startBtn').addEventListener('click',()=>{started=true;$('#start').hidden=true;play()});

/* ---------- controles ---------- */
let flashT;
function flash(icon){$('#flashIcon').innerHTML=ICON[icon];const f=$('#flash');f.classList.add('show');clearTimeout(flashT);flashT=setTimeout(()=>f.classList.remove('show'),350)}
function toggle(){if(!list.length)return;started=true;if(audio.paused){play();flash('play')}else{audio.pause();flash('pause')}}

feed.addEventListener('click',async e=>{
  const sl=e.target.closest('.slide');if(!sl)return;const s=list[+sl.dataset.i];
  if(e.target.closest('.tap'))return toggle();
  const like=e.target.closest('.like');
  if(like){s.liked=!s.liked;like.classList.toggle('on',s.liked);like.setAttribute('aria-pressed',s.liked);dbOp(st=>st.put(s));return}
  const del=e.target.closest('.del');
  if(del){
    if(!del.classList.contains('ask')){del.classList.add('ask');del.textContent='¿Quitar?';setTimeout(()=>{if(del.isConnected){del.classList.remove('ask');del.innerHTML=ICON.trash}},3000);return}
    songs=songs.filter(x=>x.id!==s.id);await dbOp(st=>st.delete(s.id));
    const next=list[+sl.dataset.i+1]?.id;render(next);info();
    if(!songs.length){audio.pause();$('#welcome').hidden=false}
  }
});

audio.addEventListener('play',()=>document.body.classList.add('playing'));
audio.addEventListener('pause',()=>document.body.classList.remove('playing'));
audio.addEventListener('ended',()=>go(1));
audio.addEventListener('timeupdate',()=>{$('#tCur').textContent=fmt(audio.currentTime);if(!seeking&&audio.duration)$('#seek').value=audio.currentTime/audio.duration*1000});
audio.addEventListener('loadedmetadata',()=>{$('#tDur').textContent=fmt(audio.duration);$('#seek').value=0});
let seeking=false;const seek=$('#seek');
seek.addEventListener('input',()=>{seeking=true;if(audio.duration)$('#tCur').textContent=fmt(seek.value/1000*audio.duration)});
seek.addEventListener('change',()=>{if(audio.duration)audio.currentTime=seek.value/1000*audio.duration;seeking=false});

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowDown'){e.preventDefault();go(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();go(-1)}
  else if(e.key===' '){e.preventDefault();toggle()}
});
try{navigator.mediaSession.setActionHandler('nexttrack',()=>go(1));navigator.mediaSession.setActionHandler('previoustrack',()=>go(-1))}catch(e){}

function tabs(){$('#tabAll').classList.toggle('on',mode==='all');$('#tabFav').classList.toggle('on',mode==='fav')}
$('#tabAll').addEventListener('click',()=>{if(mode==='all')return;mode='all';tabs();render(list[cur]?.id)});
$('#tabFav').addEventListener('click',()=>{if(mode==='fav')return;mode='fav';tabs();render()});

function info(){$('#info').textContent=songs.length+' canciones · '+songs.filter(s=>s.liked).length+' con corazón'+(saveOK?'':' · No se pudieron guardar en este navegador: tendrás que elegirlas de nuevo la próxima vez.')}
$('#menuBtn').addEventListener('click',()=>{info();$('#sheet').classList.add('open')});
$('#closeSheet').addEventListener('click',()=>$('#sheet').classList.remove('open'));
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('open')});
$('#shuffleBtn').addEventListener('click',()=>{shuffle(songs);$('#sheet').classList.remove('open');render()});
const clearBtn=$('#clearBtn');
clearBtn.addEventListener('click',async()=>{
  if(!clearBtn.dataset.ask){clearBtn.dataset.ask='1';clearBtn.textContent='Toca otra vez para confirmar';setTimeout(()=>{delete clearBtn.dataset.ask;clearBtn.textContent='Borrar todas las canciones'},3000);return}
  await dbOp(st=>st.clear());songs=[];audio.pause();render();$('#sheet').classList.remove('open');$('#welcome').hidden=false;
});

/* ---------- inicio ---------- */
(async()=>{
  try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js')}catch(e){}
  db=await openDB();
  try{navigator.storage?.persist?.()}catch(e){}
  songs=shuffle(await dbAll());

})();
